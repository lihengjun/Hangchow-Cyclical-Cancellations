# 基础设置
theme: jekyll-theme-cayman
title: Hangchow Cyclical Cancellations
description: 杭州城幹支戳蓃集
author: lihengjun

# URL 配置（绑定域名后修改）
url: "https://lihengjun.github.io"  # 绑定域名后改为 https://你的域名.com
baseurl: "/Hangchow-Cyclical-Cancellations"  # 绑定域名后改为 ""

# 语言和时区
lang: zh-CN
timezone: Asia/Shanghai

# Markdown 处理
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# 永久链接
permalink: /:title/

# 插件（GitHub Pages 支持的）
plugins:
  - jekyll-relative-links
  - jekyll-sitemap

# 相对链接
relative_links:
  enabled: true
  collections: false

# 排除文件
exclude:
  - "*.tmp"
  - ".obsidian"
  - "Gemfile"
  - "Gemfile.lock"

# 默认值
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      author: "lihengjun"